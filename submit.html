<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Your Song</title>
    <style>
        :root {
            --bg-darker: #050505;
            --neon-green: #39ff14;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --card-bg: #111111;
        }
        body {
            background-color: var(--bg-darker);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 1rem;
            text-align: left;
        }
        h3 { margin-top: 0; font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; line-height: 1.5; }
        
        .btn-buy { 
            background-color: transparent; 
            padding: 0.6rem 1rem; 
            border-radius: 15px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: all 0.3s;
            border: 1px solid #444;
            color: #a0a0a0;
            flex: 1;
        }
        .btn-buy.active-email { border-color: #ff8c00; color: #ff8c00; }
        .btn-buy.active-wa { border-color: #25D366; color: #25D366; }

        .custom-input {
            width: 100%;
            padding: 0.8rem;
            background: var(--card-bg);
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            outline: none;
            margin-bottom: 1rem;
            font-family: inherit;
            box-sizing: border-box;
        }
        .custom-input:focus { border-color: #ff8c00; }

        .btn-submit-song {
            background-color: #ff8c00;
            color: #fff;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn-submit-song:hover { background-color: #e67e00; }
        
        .btn-wa { background-color: #25D366; text-decoration: none; display: block; text-align: center; }
        .btn-wa:hover { background-color: #1ebe57; }
    </style>
</head>
<body>
    <h3>Submit Your Track</h3>
    <p style="margin-bottom: 1rem;">Choose your preferred method:</p>
    
    <div style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem;">
        <button type="button" class="btn-buy active-email" onclick="switchMethod('email')" id="btn-song-email">Email</button>
        <button type="button" class="btn-buy" onclick="switchMethod('whatsapp')" id="btn-song-wa">WhatsApp</button>
    </div>

    <!-- Email Form -->
    <form id="song-email-form" onsubmit="sendSongEmail(event)">
        <input type="email" id="song-email" class="custom-input" placeholder="Your Email Address" required>
        <input type="text" id="song-subject" class="custom-input" placeholder="Song Title & Artist" required>
        <textarea id="song-message" class="custom-input" placeholder="Tell us about the song..." rows="3" required></textarea>
        
        <label style="display:block; color:var(--text-muted); margin-bottom:0.5rem; font-size:0.85rem;">Attach File (MP3/WAV):</label>
        <input type="file" id="song-file" accept="audio/*" style="width: 100%; color: #fff; margin-bottom: 1rem; font-size: 0.85rem;">
        
        <button type="submit" class="btn-submit-song">Prepare Email</button>
    </form>
    
    <!-- WhatsApp Form -->
    <div id="song-wa-form" style="display: none;">
        <p>Click below to open WhatsApp. You can type your message and attach your audio file directly in the chat!</p>
        <a href="https://wa.me/26772960417?text=Hi%20Lobatse%20Radio,%20I%20would%20like%20to%20submit%20my%20song%20for%20airplay!" target="_blank" class="btn-submit-song btn-wa">Open WhatsApp</a>
    </div>

    <script>
        function switchMethod(method) {
            const emailForm = document.getElementById('song-email-form');
            const waForm = document.getElementById('song-wa-form');
            const btnEmail = document.getElementById('btn-song-email');
            const btnWa = document.getElementById('btn-song-wa');

            if(method === 'email') {
                emailForm.style.display = 'block';
                waForm.style.display = 'none';
                btnEmail.className = 'btn-buy active-email';
                btnWa.className = 'btn-buy';
            } else {
                emailForm.style.display = 'none';
                waForm.style.display = 'block';
                btnEmail.className = 'btn-buy';
                btnWa.className = 'btn-buy active-wa';
            }
        }

        function sendSongEmail(e) {
            e.preventDefault();
            const email = document.getElementById('song-email').value;
            const subj = document.getElementById('song-subject').value;
            const msg = document.getElementById('song-message').value;
            
            const body = encodeURIComponent("From: " + email + "\n\n" + msg + "\n\n(Please remember to attach your song file to this email before sending!)");
            window.top.location.href = "mailto:lobatseonlineradio@gmail.com?subject=" + encodeURIComponent("Song Submission: " + subj) + "&body=" + body;
        }
    </script>
</body>
</html>
