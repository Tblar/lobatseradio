<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobatse Radio Shop</title>
    <style>
        :root {
            --bg-darker: #050505;
            --neon-green: #39ff14;
            --text-main: #ffffff;
            --card-bg: #111111;
            --card-border: #222222;
        }
        body {
            background-color: var(--bg-darker);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 1rem;
        }
        .section-header {
            font-size: 2rem;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .neon-text { 
            color: var(--neon-green); 
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.2); 
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--card-border);
            text-align: left;
            display: flex;
            flex-direction: column;
        }
        .item-img { 
            width: 100%; 
            height: 200px; 
            object-fit: contain; 
            background: #fff; 
            border-radius: 5px; 
            margin-bottom: 1rem; 
        }
        .btn-buy { 
            background-color: transparent; 
            color: var(--neon-green); 
            border: 1px solid var(--neon-green); 
            padding: 0.4rem 1rem; 
            border-radius: 15px; 
            cursor: pointer; 
            margin-top: 1rem; 
            font-weight: bold; 
            align-self: flex-start; 
            transition: 0.3s; 
        }
        .btn-buy:hover { 
            background-color: var(--neon-green); 
            color: #000; 
        }
    </style>
</head>
<body>
    <div class="section-header">Mini <span class="neon-text">Shop</span></div>
    <div class="grid-container" id="shop-grid">
        <!-- Items are injected here -->
    </div>

    <script>
        // ADD OR CHANGE YOUR SHOP ITEMS HERE
        const shopData = [
            { name: "Lobatse Radio Cup", price: "P35.00", image: "IMG_3420.JPG" },
            { name: "Lobatse Radio T-Shirt", price: "P170.00", image: "IMG_3422.JPG" },
            { name: "Lobatse Radio Hoody", price: "P200.00", image: "Gemini_Generated_Image (3).jpeg" }
        ];

        const shopGrid = document.getElementById('shop-grid');
        shopData.forEach(item => {
            shopGrid.innerHTML += `
                <div class="card">
                    <img src="${item.image}" alt="${item.name}" class="item-img">
                    <h3 style="margin: 1rem 0 0.5rem; font-size: 1.1rem;">${item.name}</h3>
                    <div style="color: #39ff14; font-weight: bold; font-size: 1.1rem;">${item.price}</div>
                    <button class="btn-buy">Buy Now</button>
                </div>
            `;
        });
    </script>
</body>
</html>
